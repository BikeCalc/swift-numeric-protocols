name: Benchmark

on:
  push:
    branches: ["main", "release/**"]
  pull_request:
    branches: ["main", "release/**"]
  workflow_dispatch:

jobs:
  benchmarks:
    name: Compare Benchmarks
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Get Swift Version
        run: swift --version
      - name: Select Comparison Revision
        id: comparison
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          baseline_sha=""

          if [ "$EVENT_NAME" = "pull_request" ]; then
            baseline_sha="$BASE_SHA"
          elif [ "$EVENT_NAME" = "push" ] && ! printf '%s' "$BEFORE_SHA" | grep -q '^0*$'; then
            baseline_sha="$BEFORE_SHA"
          fi

          echo "baseline_sha=$baseline_sha" >> "$GITHUB_OUTPUT"
      - name: Run Baseline Benchmarks
        id: baseline
        if: steps.comparison.outputs.baseline_sha != ''
        env:
          BASELINE_SHA: ${{ steps.comparison.outputs.baseline_sha }}
        run: |
          baseline_directory="$RUNNER_TEMP/numerics-extended-baseline"
          git worktree add --detach "$baseline_directory" "$BASELINE_SHA"

          if ! grep -q 'name: "NumericsExtendedBenchmarks"' "$baseline_directory/Package.swift"; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          rm -rf "$baseline_directory/Benchmarks/NumericsExtendedBenchmarks"
          mkdir -p "$baseline_directory/Benchmarks"
          cp -R Benchmarks/NumericsExtendedBenchmarks "$baseline_directory/Benchmarks/NumericsExtendedBenchmarks"

          swift run \
            --package-path "$baseline_directory" \
            --configuration release \
            NumericsExtendedBenchmarks \
            --output "$RUNNER_TEMP/benchmark-baseline.json"
          echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Run Current Benchmarks
        run: |
          swift run \
            --configuration release \
            NumericsExtendedBenchmarks \
            --output "$RUNNER_TEMP/benchmark-current.json"
      - name: Summarize Performance
        env:
          BASELINE_AVAILABLE: ${{ steps.baseline.outputs.available }}
        run: |
          comparison_arguments=(
            --current "$RUNNER_TEMP/benchmark-current.json"
          )

          if [ "$BASELINE_AVAILABLE" = "true" ]; then
            comparison_arguments+=(
              --baseline "$RUNNER_TEMP/benchmark-baseline.json"
            )
          fi

          swift Scripts/CompareBenchmarkResults.swift \
            "${comparison_arguments[@]}" >> "$GITHUB_STEP_SUMMARY"
