name: Test

on:
  push:
    branches: ["main", "release/**"]
  pull_request:
    branches: ["main", "release/**"]

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Get Swift Version
        run: swift --version
      - name: Build Package
        run: swift build
      - name: Test Package
        run: swift test
