name: Plan a task
description: Define accepted work that is ready for delivery.
title: ""
labels: ["task"]
body:
  - type: textarea
    id: overview
    attributes:
      label: Overview
      description: Describe the task, its scope, and why it matters.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: List the conditions that must be satisfied before this issue can be closed.
      value: |
        - [ ]
    validations:
      required: true

  - type: textarea
    id: testing-scenarios
    attributes:
      label: Testing Scenarios
      description: List any scenarios agreed during refinement that must be verified.
      value: |
        - [ ]
    validations:
      required: false

  - type: textarea
    id: additional-information
    attributes:
      label: Additional Information
      description: Add design decisions, constraints, dependencies, research, risks, or deferred work.
    validations:
      required: false
