name: Report a documentation issue
description: Report unclear, missing, or incorrect documentation.
title: ""
labels: ["documentation", "triage needed"]
body:
  - type: textarea
    id: location
    attributes:
      label: Location
      description: Link the page, section, symbol, or file where you found the issue.
      placeholder: "Example: Documentation page, DocC article, README section, or source file."
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain what is unclear, missing, or incorrect.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested Improvement
      description: Describe the change you would like to see.
    validations:
      required: false

  - type: textarea
    id: additional-information
    attributes:
      label: Additional Information
      description: Add any extra context, links, screenshots, or notes.
    validations:
      required: false
