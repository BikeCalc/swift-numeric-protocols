name: Report a bug
description: Report incorrect or unexpected behavior.
title: ""
labels: ["bug", "triage needed"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug. Please include enough detail to reproduce the behavior.

  - type: textarea
    id: overview
    attributes:
      label: Overview
      description: Describe the incorrect or unexpected behavior and why it matters.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest example or sequence of steps that reproduces the issue.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: Describe what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: Describe what happened instead. Include terminal output if useful.
      render: text
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provide the relevant environment details.
      value: |
        - Swift version:
        - Platform and platform version:
        - Deployment target, if explicitly set:
        - Package tag, branch, or commit:
        - Xcode version, if relevant:
        - Configuration or feature flags, if relevant:
    validations:
      required: true

  - type: textarea
    id: additional-information
    attributes:
      label: Additional Information
      description: Add logs, screenshots, workarounds, regression details, or related reports.
    validations:
      required: false
