name: Report a bug
description: Report incorrect or unexpected package behavior.
title: "[Bug]: "
labels: ["bug", "triage needed"]
body:
  - type: markdown
    attributes:
      value: >
        Thanks for reporting a bug. Please include enough detail for the behavior
        to be reproduced in a small Swift package or snippet.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the problem in human language.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest Swift example that reproduces the issue.
      value: |
        ```swift

        ```
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: Describe what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: Describe what happened instead. Include terminal output if useful.
      render: text
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provide Swift, platform, and package details.
      value: |
        - Swift version:
        - Xcode version:
        - Platform:
        - Package tag, branch, or commit:
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: List any commands you ran.
      value: |
        - [ ] `swift build`
        - [ ] `swift test`
        - [ ] `swift package generate-documentation --target NumericsExtended`
    validations:
      required: false

  - type: textarea
    id: additional-information
    attributes:
      label: Additional Information
      description: Add any extra context, links, screenshots, or notes.
    validations:
      required: false
