name: Request documentation
description: Request new documentation or an improvement to existing documentation.
title: ""
labels: ["documentation", "triage needed"]
body:
  - type: textarea
    id: overview
    attributes:
      label: Overview
      description: Describe what documentation is missing, unclear, or incorrect and why it matters.
    validations:
      required: true

  - type: textarea
    id: location
    attributes:
      label: Location
      description: If existing documentation should be updated, link or identify it here.
      placeholder: "Example: Documentation page, guide, README section, or source documentation."
    validations:
      required: false

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the documentation you would like to see.
    validations:
      required: false

  - type: textarea
    id: additional-information
    attributes:
      label: Additional Information
      description: Add screenshots, references, examples, or related documentation.
    validations:
      required: false
