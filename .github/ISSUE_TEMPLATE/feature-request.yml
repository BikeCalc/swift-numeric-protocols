name: Request a change
description: Suggest a feature, improvement, protocol, numeric type, or behavior change.
title: "[Change]: "
labels: ["enhancement", "triage needed"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Describe the problem, limitation, or opportunity.
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe the change you would like to make.
    validations:
      required: true

  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: Show how the API or behavior might look in Swift.
      value: |
        ```swift

        ```
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: List other approaches and why they may not be ideal.
    validations:
      required: false

  - type: textarea
    id: additional-information
    attributes:
      label: Additional Information
      description: Add any extra context, links, prior art, or notes.
    validations:
      required: false
