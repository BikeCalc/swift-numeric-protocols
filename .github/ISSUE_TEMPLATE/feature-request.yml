name: Request a feature
description: Suggest a new capability or improvement for consideration.
title: ""
labels: ["enhancement", "triage needed"]
body:
  - type: textarea
    id: overview
    attributes:
      label: Overview
      description: Describe the problem, limitation, or opportunity and who would benefit.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the change you would like to see.
    validations:
      required: true

  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: Add examples, sample usage, user flows, designs, screenshots, or other illustrations of the proposal.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: List other approaches and why they may not be ideal.
    validations:
      required: false

  - type: textarea
    id: additional-information
    attributes:
      label: Additional Information
      description: Add designs, research, constraints, or related requests.
    validations:
      required: false
