name: Prepare a release
description: Track the scope, remaining work, and context for an upcoming release.
title: ""
labels: ["release", "triage needed"]
body:
  - type: textarea
    id: overview
    attributes:
      label: Overview
      description: Briefly describe the release and why it matters.
    validations:
      required: true

  - type: textarea
    id: related-issues
    attributes:
      label: Related Issues
      description: Link issues that are included in this release.
      value: |
        - 
    validations:
      required: false

  - type: textarea
    id: checklist
    attributes:
      label: Checklist
      description: List the concrete work needed for the release.
      value: |
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: additional-information
    attributes:
      label: Additional Information
      description: Add release constraints, decisions, risks, or follow-up context.
    validations:
      required: false
