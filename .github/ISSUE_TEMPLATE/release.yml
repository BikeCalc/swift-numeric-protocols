name: Prepare a release
description: Track the scope, remaining work, and context for an upcoming release.
title: ""
labels: ["release"]
body:
  - type: textarea
    id: overview
    attributes:
      label: Overview
      description: Briefly describe the release and why it matters.
    validations:
      required: true

  - type: textarea
    id: checklist
    attributes:
      label: Checklist
      description: List the high-level outcomes and other release-wide work included in the release.
      value: |
        - [ ]
    validations:
      required: true

  - type: textarea
    id: additional-information
    attributes:
      label: Additional Information
      description: Add release notes, risks, rollout considerations, or follow-up work.
    validations:
      required: false
